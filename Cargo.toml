[package]
name = "kanzo"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "Self-hosted kanban for humans and agents. One 4.7 MB binary, starts in 3 ms, zero setup."
license = "AGPL-3.0-only"
repository = "https://github.com/emanuele-em/kanzo"
homepage = "https://github.com/emanuele-em/kanzo"
readme = "README.md"
keywords = ["kanban", "mcp", "agents", "todo", "claude"]
categories = ["command-line-utilities", "development-tools"]
# Only what builds Kanzo: the README's screenshots and the repo's GitHub files stay out.
exclude = [
    "/docs",
    "/.github",
    "/.cargo",
    "/dist-workspace.toml",
    "/rustfmt.toml",
    "/server.json",
    "/README.zh.md",
    "/Containerfile",
    "/Dockerfile",
    "/.dockerignore",
    "/compose.yaml",
    "/quadlet",
]

[dependencies]
anyhow = "1.0.104"
# Only the parts Kanzo uses: forms, logging and the other extractors stay out.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
# Lists this computer's addresses for `kanzo share`; uses only libc and windows-sys, already built in.
if-addrs = "0.15.0"
# Already built in by other crates; tells which lock errors mean "no locks here".
libc = "0.2.191"
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
# Kanzo reads config.toml and never writes TOML.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

# Small and fast: opt-level "s" measured 30% smaller than 3 at the same speed,
# while "z" was smaller still but twice as slow to render a large board.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
