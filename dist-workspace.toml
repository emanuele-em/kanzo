[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Macs, 64-bit Intel and AMD Windows, and static Linux builds that need no particular
# glibc: old PCs, Raspberry Pi 3/4/5 (64-bit), Pi 2/3 on a 32-bit OS, and Pi Zero/1 (ARMv6).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
    "arm-unknown-linux-musleabihf",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Sign each release's files with a GitHub build attestation, for `gh attestation verify`
github-attestations = true
# After every file is built, so the installer and sha256.sum are signed too
github-attestations-phase = "host"
# Also publish each release to crates.io, for `cargo install kanzo`
publish-jobs = ["./publish-crates"]

# Build on the newest runners: Ubuntu 26.04 LTS, macOS 26 and Windows Server 2025. dist's defaults,
# Ubuntu 22.04 and macOS 14, are deprecated on GitHub.
[dist.github-custom-runners]
global = "ubuntu-26.04"
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26-intel"
x86_64-pc-windows-msvc = "windows-2025"
x86_64-unknown-linux-musl = "ubuntu-26.04"
aarch64-unknown-linux-musl = "ubuntu-26.04-arm"
# dist does not know ubuntu-26.04 yet and would take it for the target itself,
# skipping the cross-compiler; say these two build on x64.
armv7-unknown-linux-musleabihf = { runner = "ubuntu-26.04", host = "x86_64-unknown-linux-gnu" }
arm-unknown-linux-musleabihf = { runner = "ubuntu-26.04", host = "x86_64-unknown-linux-gnu" }
